name: Update IPTV Playlists

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时自动运行一次（UTC 时间）
  workflow_dispatch:          # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: update-iptv
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aggregate & Speed-test
        run: node scripts/aggregate.mjs

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "播放列表无变化，跳过提交"
          else
            git commit -m "chore: update playlists ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi
